; Config for image_transfer_profiler.py. Command-line flags override these values.
; Leave a value empty to ignore it. No quotes needed, regexes are written as-is.

[mqtt]
; All components (gateway, bridge, backend) share this one broker.
broker = localhost
port = 1883
; Leave empty for a unique id per run (needed when several machines run this tool).
client_id =
username =
password =

[device]
; Tag under test. Fill all three for the strictest filter.
;   dev_id  : filters <dev_id>/Command and the Image command downlink (DeviceID)
;   deveui  : filters gateway uplinks
;   devaddr : strict filter for uplinks and downlinks/<devaddr> (chunk downlinks only carry this)
;             Leave empty to learn it automatically (needed for OTAA, where it changes on re-join).
dev_id = T3CDC75810B64
deveui = AC1F09FFFE1E49B2
devaddr =
; Gateway timestamp field in the MQTT JSON (dotted path allowed, e.g. rxInfo.time).
ts_field = timestamp
; Added to gateway timestamps to align with this PC's clock (ms).
gw_offset_ms = 0

[serial]
; ESP32 log port: COM5 on Windows, /dev/ttyUSB0 on Linux. Empty = gateway-side metrics only.
serial_port = COM5
baud = 115200
; The two ESP32 log lines (regex, searched in each line). Group idx = chunk index.
; The port can be opened by only ONE program: close `idf.py monitor` first. With echo = true this tool
; replaces the monitor (prints every line, ANSI colours stripped) and raw_log keeps the full log.
echo = true
raw_log = serial_raw.log
req_pattern = Request chunk (?P<idx>\d+)
recv_pattern = Got chunk (?P<idx>\d+)

[profiler]
out_dir = transfer_logs
; Close a session after this many seconds without events.
idle_timeout = 120
; Keep a finished session open this long for late events.
grace = 5
